<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"/>
<title>JUMP!</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  height:100%;
  background:#07071a;
  font-family:'Segoe UI',system-ui,sans-serif;
  color:#fff;
  overflow:hidden;
  touch-action:none;
  user-select:none;
}

/* ─── Shared layout ─────────────────────────────── */
.screen{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:0;
  transition:opacity .35s,transform .35s;
}
.screen.hidden{opacity:0;pointer-events:none;transform:scale(.97);}

/* ─── HOME SCREEN ───────────────────────────────── */
#home{gap:0;}
.logo{
  font-size:clamp(52px,10vw,88px);
  font-weight:900;
  letter-spacing:-3px;
  line-height:1;
  background:linear-gradient(135deg,#fff 30%,rgba(255,255,255,.45));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  margin-bottom:6px;
}
.tagline{
  font-size:13px;letter-spacing:4px;
  color:rgba(255,255,255,.3);
  text-transform:uppercase;
  margin-bottom:48px;
}
.home-name-row{
  display:flex;gap:8px;margin-bottom:28px;width:100%;max-width:340px;
}
.name-input{
  flex:1;background:rgba(255,255,255,.06);
  border:1.5px solid rgba(255,255,255,.12);
  border-radius:10px;padding:12px 16px;
  color:#fff;font-size:15px;outline:none;
  transition:border-color .2s;
}
.name-input:focus{border-color:rgba(255,255,255,.4);}
.name-input::placeholder{color:rgba(255,255,255,.22);}

.home-btns{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px;}

.btn-create{
  background:linear-gradient(135deg,#6BCB77,#43A047);
  border:none;color:#fff;font-size:16px;font-weight:800;
  letter-spacing:.5px;padding:16px;border-radius:14px;
  cursor:pointer;transition:opacity .2s,transform .1s;
  text-transform:uppercase;
}
.btn-create:hover{opacity:.9;}
.btn-create:active{transform:scale(.97);}

.btn-join-outer{
  display:flex;flex-direction:column;gap:8px;
}
.btn-join{
  background:rgba(255,255,255,.07);
  border:1.5px solid rgba(255,255,255,.15);
  color:#fff;font-size:16px;font-weight:800;
  letter-spacing:.5px;padding:16px;border-radius:14px;
  cursor:pointer;transition:background .2s,transform .1s;
  text-transform:uppercase;
}
.btn-join:hover{background:rgba(255,255,255,.12);}
.btn-join:active{transform:scale(.97);}

.join-expand{
  overflow:hidden;max-height:0;
  transition:max-height .3s ease;
}
.join-expand.open{max-height:80px;}
.join-row{display:flex;gap:8px;}
.code-input{
  flex:1;background:rgba(255,255,255,.06);
  border:1.5px solid rgba(255,255,255,.12);
  border-radius:10px;padding:12px 16px;
  color:#fff;font-size:18px;font-weight:700;
  letter-spacing:4px;text-transform:uppercase;
  outline:none;text-align:center;
  transition:border-color .2s;
}
.code-input:focus{border-color:rgba(255,255,255,.4);}
.code-input::placeholder{letter-spacing:2px;font-size:13px;font-weight:400;color:rgba(255,255,255,.22);}
.btn-go{
  background:rgba(255,255,255,.12);
  border:1.5px solid rgba(255,255,255,.2);
  color:#fff;font-size:14px;font-weight:800;
  padding:12px 22px;border-radius:10px;
  cursor:pointer;transition:background .15s;white-space:nowrap;
}
.btn-go:hover{background:rgba(255,255,255,.2);}

.error-msg{
  color:#FF6B6B;font-size:13px;text-align:center;
  min-height:18px;margin-top:4px;letter-spacing:.5px;
}

/* ─── LOBBY SCREEN ──────────────────────────────── */
#lobby-screen{gap:0;padding:24px;}
.lobby-card{
  background:rgba(15,15,40,.96);
  border:1.5px solid rgba(255,255,255,.09);
  border-radius:20px;
  padding:32px 40px;
  width:100%;max-width:420px;
  text-align:center;
}
.lobby-title{font-size:28px;font-weight:900;margin-bottom:4px;}
.lobby-sub{font-size:12px;letter-spacing:3px;color:rgba(255,255,255,.3);margin-bottom:24px;text-transform:uppercase;}

.code-display{
  background:rgba(255,255,255,.05);
  border:1.5px dashed rgba(255,255,255,.15);
  border-radius:12px;
  padding:14px;margin-bottom:20px;
}
.code-label{font-size:11px;letter-spacing:3px;color:rgba(255,255,255,.3);margin-bottom:6px;text-transform:uppercase;}
.code-value{
  font-size:34px;font-weight:900;letter-spacing:8px;
  color:#FFD93D;font-family:monospace;
}
.code-hint{font-size:11px;color:rgba(255,255,255,.25);margin-top:4px;}

.player-list{display:flex;flex-direction:column;gap:7px;margin-bottom:22px;min-height:44px;}
.player-row{
  display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.05);
  border-radius:10px;padding:9px 13px;
}
.player-dot{width:13px;height:13px;border-radius:3px;flex-shrink:0;}
.player-name{font-size:14px;font-weight:600;flex:1;text-align:left;}
.badge{
  font-size:10px;font-weight:700;letter-spacing:1px;
  padding:3px 8px;border-radius:20px;
}
.badge-host{background:rgba(255,212,50,.15);color:#FFD93D;}
.badge-you{background:rgba(255,255,255,.08);color:rgba(255,255,255,.4);}

.btn-start{
  width:100%;background:linear-gradient(135deg,#6BCB77,#43A047);
  border:none;color:#fff;font-size:16px;font-weight:800;
  padding:15px;border-radius:14px;cursor:pointer;
  text-transform:uppercase;letter-spacing:1px;
  transition:opacity .2s,transform .1s;
}
.btn-start:hover{opacity:.9;}
.btn-start:active{transform:scale(.97);}
.btn-start:disabled{
  background:rgba(255,255,255,.07);
  color:rgba(255,255,255,.25);cursor:default;
}
.wait-msg{color:rgba(255,255,255,.3);font-size:12px;margin-top:10px;letter-spacing:1px;}

/* ─── GAME SCREEN ───────────────────────────────── */
#game-screen{padding:0;gap:0;background:#07071a;}
#wrap{
  position:relative;
  border-radius:14px;overflow:hidden;
  border:1.5px solid rgba(255,255,255,.06);
  box-shadow:0 0 80px rgba(0,0,0,.8);
}
canvas{display:block;}

/* Jump button */
#jumpBtn{
  margin-top:14px;
  background:rgba(255,255,255,.07);
  border:1.5px solid rgba(255,255,255,.14);
  color:#fff;font-size:15px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;
  padding:14px 52px;border-radius:40px;
  cursor:pointer;outline:none;
  -webkit-tap-highlight-color:transparent;
  transition:background .12s,transform .1s;
}
#jumpBtn:active{background:rgba(255,255,255,.18);transform:scale(.96);}

/* Round-over overlay */
#roundover{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;transition:opacity .4s;
  background:rgba(7,7,26,.55);backdrop-filter:blur(4px);
}
#roundover.hidden{opacity:0;}
.ro-box{
  background:rgba(10,10,35,.9);
  border:1.5px solid rgba(255,255,255,.1);
  border-radius:18px;padding:32px 56px;text-align:center;
}
.ro-title{font-size:44px;font-weight:900;color:#FFD93D;margin-bottom:6px;}
.ro-sub{color:rgba(255,255,255,.4);font-size:13px;letter-spacing:2px;}

/* countdown overlay */
#countdown-overlay{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;
}
#countdown-overlay.hidden{opacity:0;}
.cd-num{
  font-size:120px;font-weight:900;
  color:#FFD93D;
  text-shadow:0 0 40px rgba(255,210,50,.6);
  animation:cdpop .9s ease-out forwards;
}
@keyframes cdpop{
  0%{transform:scale(1.4);opacity:0;}
  20%{transform:scale(1);opacity:1;}
  80%{transform:scale(1);opacity:1;}
  100%{transform:scale(.7);opacity:0;}
}
</style>
</head>
<body>

<!-- HOME -->
<div id="home" class="screen">
  <div class="logo">JUMP!</div>
  <div class="tagline">Multiplayer · Last One Standing</div>

  <div class="home-name-row">
    <input class="name-input" id="homeNameInput" type="text" maxlength="16" placeholder="Your name…"/>
  </div>

  <div class="home-btns">
    <button class="btn-create" id="btnCreate">🎮 Create Lobby</button>

    <div class="btn-join-outer">
      <button class="btn-join" id="btnJoinToggle">🔑 Join with Code</button>
      <div class="join-expand" id="joinExpand">
        <div class="join-row">
          <input class="code-input" id="codeInput" type="text" maxlength="5" placeholder="Enter code…"/>
          <button class="btn-go" id="btnJoinGo">JOIN →</button>
        </div>
      </div>
      <div class="error-msg" id="homeError"></div>
    </div>
  </div>
</div>

<!-- LOBBY -->
<div id="lobby-screen" class="screen hidden">
  <div class="lobby-card">
    <div class="lobby-title">Lobby</div>
    <div class="lobby-sub">Share the code with your friends</div>

    <div class="code-display">
      <div class="code-label">Room Code</div>
      <div class="code-value" id="lobbyCode">—</div>
      <div class="code-hint">Everyone on the same WiFi can join</div>
    </div>

    <div id="winnerBanner" style="display:none;background:rgba(255,212,50,.1);border:1.5px solid rgba(255,212,50,.25);border-radius:10px;padding:10px 14px;margin-bottom:16px;text-align:center;">
      <div style="font-size:11px;letter-spacing:2px;color:rgba(255,212,50,.6);text-transform:uppercase;margin-bottom:3px;">Last Round</div>
      <div id="winnerText" style="font-size:18px;font-weight:800;color:#FFD93D;"></div>
    </div>

    <div class="player-list" id="lobbyPlayerList"></div>

    <button class="btn-start" id="btnStart" disabled>START GAME</button>
    <div class="wait-msg" id="waitMsg"></div>
  </div>
</div>

<!-- GAME -->
<div id="game-screen" class="screen hidden">
  <div id="wrap">
    <canvas id="c"></canvas>
    <div id="roundover" class="hidden">
      <div class="ro-box">
        <div class="ro-title" id="roTitle">—</div>
        <div class="ro-sub">Returning to lobby…</div>
      </div>
    </div>
    <div id="countdown-overlay" class="hidden">
      <div class="cd-num" id="cdNum">3</div>
    </div>
  </div>
  <button id="jumpBtn">▲ &nbsp;JUMP</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
// ── Config ─────────────────────────────────────────────────────────
const SERVER_URL = window.location.origin;

// ── Canvas setup ───────────────────────────────────────────────────
const canvas  = document.getElementById('c');
const ctx     = canvas.getContext('2d');
const WORLD_W = 1100, WORLD_H = 500;

function resizeCanvas() {
  const mw = Math.min(window.innerWidth  - 16, WORLD_W);
  const mh = Math.min(window.innerHeight - 80, WORLD_H);
  const sc = Math.min(mw / WORLD_W, mh / WORLD_H);
  canvas.style.width  = (WORLD_W * sc) + 'px';
  canvas.style.height = (WORLD_H * sc) + 'px';
  canvas.width  = WORLD_W;
  canvas.height = WORLD_H;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ── State ──────────────────────────────────────────────────────────
const PLAYER_X  = 120;
const PLAYER_W  = 44;
const PLAYER_H  = 54;
const GROUND_Y  = 400;

let myId   = null;
let snap   = null;
let lastCd = -1;
let stars  = Array.from({length:100}, () => ({
  x: Math.random()*WORLD_W, y: Math.random()*(WORLD_H*.8),
  r: Math.random()*1.3+.3, a: Math.random()*.55+.1,
}));

// mountain silhouettes (static)
const mountains = Array.from({length:12}, () => ({
  x: Math.random()*WORLD_W,
  h: 60 + Math.random()*120,
  w: 80 + Math.random()*120,
}));

// ── Screen management ──────────────────────────────────────────────
let currentScreen = 'home';

function showScreen(id) {
  if (currentScreen === id) return;
  currentScreen = id;
  ['home','lobby-screen','game-screen'].forEach(s => {
    document.getElementById(s).classList.toggle('hidden', s !== id);
  });
}

// ── Socket ─────────────────────────────────────────────────────────
const socket = io(SERVER_URL, { transports:['websocket','polling'] });

// Joined a room — go to lobby
socket.on('joined', ({ code, playerId, phase }) => {
  myId = playerId;
  document.getElementById('lobbyCode').textContent = code;
  // If game already started (someone re-joining somehow), go straight to game
  if (phase && phase !== 'lobby') {
    showScreen('game-screen');
  } else {
    showScreen('lobby-screen');
  }
});

socket.on('joinError', msg => {
  document.getElementById('homeError').textContent = msg;
});

// Dedicated phase-change event — this is what switches screens
socket.on('phaseChange', phase => {
  if (phase === 'lobby') {
    showScreen('lobby-screen');
    // immediately repopulate lobby with latest snap if we have it
    if (snap) updateLobbyUI(snap);
  } else {
    showScreen('game-screen');
  }
});

// Game state — update data and UI for current screen
socket.on('gs', s => {
  snap = s;
  if (currentScreen === 'lobby-screen') {
    updateLobbyUI(s);
  } else if (currentScreen === 'game-screen') {
    updateGameUI(s);
  }
});

// ── Home UI ────────────────────────────────────────────────────────
const joinExpand   = document.getElementById('joinExpand');
let joinOpen = false;

document.getElementById('btnCreate').addEventListener('click', () => {
  const name = document.getElementById('homeNameInput').value.trim();
  socket.emit('createLobby', { name });
});

document.getElementById('btnJoinToggle').addEventListener('click', () => {
  joinOpen = !joinOpen;
  joinExpand.classList.toggle('open', joinOpen);
  if (joinOpen) document.getElementById('codeInput').focus();
});

function doJoinLobby() {
  const name = document.getElementById('homeNameInput').value.trim();
  const code = document.getElementById('codeInput').value.trim().toUpperCase();
  document.getElementById('homeError').textContent = '';
  socket.emit('joinLobby', { name, code });
}
document.getElementById('btnJoinGo').addEventListener('click', doJoinLobby);
document.getElementById('codeInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') doJoinLobby();
  // auto uppercase
  setTimeout(() => {
    document.getElementById('codeInput').value =
      document.getElementById('codeInput').value.toUpperCase();
  }, 0);
});

// ── Lobby UI ───────────────────────────────────────────────────────
function updateLobbyUI(s) {
  const amHost = s.hostId === myId;
  const list   = document.getElementById('lobbyPlayerList');

  // always keep the code visible (important after round ends)
  if (s.code) document.getElementById('lobbyCode').textContent = s.code;

  list.innerHTML = '';
  s.players.forEach(p => {
    const row = document.createElement('div');
    row.className = 'player-row';
    row.innerHTML = `
      <span class="player-dot" style="background:${p.color}"></span>
      <span class="player-name">${esc(p.name)}</span>
      ${p.isHost        ? '<span class="badge badge-host">HOST</span>' : ''}
      ${p.id === myId   ? '<span class="badge badge-you">YOU</span>'   : ''}
    `;
    list.appendChild(row);
  });

  // winner banner (shown after a round)
  const banner     = document.getElementById('winnerBanner');
  const winnerText = document.getElementById('winnerText');
  if (s.winner) {
    banner.style.display     = 'block';
    winnerText.textContent   = s.winner === 'Nobody survived' ? '💀 Nobody survived'
                             : s.winner.includes('survived')  ? '🎉 ' + s.winner
                             : '🏆 ' + s.winner + ' wins!';
  } else {
    banner.style.display = 'none';
  }

  const startBtn = document.getElementById('btnStart');
  const waitMsg  = document.getElementById('waitMsg');

  if (amHost) {
    startBtn.disabled      = false;
    startBtn.style.display = 'block';
    startBtn.textContent   = s.winner ? '▶ PLAY AGAIN' : 'START GAME';
    waitMsg.textContent    = s.players.length < 2
      ? `${s.players.length} player connected — waiting for more or start solo!`
      : `${s.players.length} players ready!`;
  } else {
    startBtn.disabled      = true;
    startBtn.style.display = 'none';
    waitMsg.textContent    = 'Waiting for the host to start…';
  }
}

document.getElementById('btnStart').addEventListener('click', () => {
  socket.emit('startGame');
});

// ── Game UI (overlays) ─────────────────────────────────────────────
let lastPhase = null;

function updateGameUI(s) {
  // countdown overlay
  const cdOverlay = document.getElementById('countdown-overlay');
  const cdNum     = document.getElementById('cdNum');
  if (s.phase === 'countdown' && s.countdown > 0) {
    cdOverlay.classList.remove('hidden');
    if (s.countdown !== lastCd) {
      lastCd = s.countdown;
      // restart animation
      cdNum.textContent = s.countdown;
      cdNum.style.animation = 'none';
      void cdNum.offsetWidth;
      cdNum.style.animation = '';
    }
  } else if (s.phase === 'playing' && lastPhase === 'countdown') {
    // "GO!"
    cdNum.textContent = 'GO!';
    cdNum.style.animation = 'none';
    void cdNum.offsetWidth;
    cdNum.style.animation = '';
    setTimeout(() => cdOverlay.classList.add('hidden'), 700);
  } else if (s.phase !== 'countdown') {
    cdOverlay.classList.add('hidden');
  }

  // round-over
  const ro = document.getElementById('roundover');
  if (s.phase === 'roundover') {
    ro.classList.remove('hidden');
    const t = document.getElementById('roTitle');
    t.textContent = s.winner || '—';
    t.style.color = s.winner?.includes('survived') ? '#6BCB77'
                  : s.winner === 'Nobody survived'  ? '#FF6B6B'
                  : '#FFD93D';
  } else {
    ro.classList.add('hidden');
  }

  lastPhase = s.phase;
}

// ── Input ──────────────────────────────────────────────────────────
function doJump() { socket.emit('jump'); }

document.addEventListener('keydown', e => {
  if (['Space','ArrowUp','KeyW'].includes(e.code)) { e.preventDefault(); doJump(); }
});
document.getElementById('jumpBtn').addEventListener('pointerdown', e => {
  e.preventDefault(); doJump();
});
canvas.addEventListener('pointerdown', e => { e.preventDefault(); doJump(); });

// ── Drawing ─────────────────────────────────────────────────────────
let bgGrad = null;
const groundGrad = (() => {
  // created lazily after first render
  return null;
})();

function drawBg() {
  if (!bgGrad) {
    bgGrad = ctx.createLinearGradient(0,0,0,WORLD_H);
    bgGrad.addColorStop(0,'#060618');
    bgGrad.addColorStop(.65,'#0b0f28');
    bgGrad.addColorStop(1,'#0e1530');
  }
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0,0,WORLD_W,WORLD_H);

  // stars
  stars.forEach(s => {
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${s.a})`; ctx.fill();
  });

  // mountain silhouettes
  ctx.fillStyle = 'rgba(255,255,255,.025)';
  mountains.forEach(m => {
    ctx.beginPath();
    ctx.moveTo(m.x, GROUND_Y);
    ctx.lineTo(m.x + m.w/2, GROUND_Y - m.h);
    ctx.lineTo(m.x + m.w, GROUND_Y);
    ctx.closePath(); ctx.fill();
  });
}

function drawGround() {
  // ground glow
  ctx.shadowColor = 'rgba(80,180,255,.5)';
  ctx.shadowBlur  = 14;
  ctx.strokeStyle = 'rgba(80,180,255,.55)';
  ctx.lineWidth   = 2.5;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y); ctx.lineTo(WORLD_W, GROUND_Y);
  ctx.stroke();
  ctx.shadowBlur  = 0;

  // subtle ground fill
  ctx.fillStyle = 'rgba(80,180,255,.04)';
  ctx.fillRect(0, GROUND_Y, WORLD_W, WORLD_H - GROUND_Y);
}

function drawPlayers(players) {
  if (!players) return;
  // draw dead first, then alive on top
  const sorted = [...players].sort((a,b) => (a.alive?1:0)-(b.alive?1:0));
  sorted.forEach(p => drawPlayer(p));
}

function drawPlayer(p) {
  const isMe = p.id === myId;

  if (!p.alive) {
    // dead: flying off screen
    const py = GROUND_Y - PLAYER_H - p.jumpH - p.deadY;
    const px = PLAYER_X + p.deadVX * 8;
    if (py > WORLD_H + 60) return; // fully off screen
    ctx.globalAlpha = Math.max(0, 0.35 - p.deadY / 200);
    drawRect(px, py, PLAYER_W, PLAYER_H, p.color, false, p);
    ctx.globalAlpha = 1;
    return;
  }

  const py = GROUND_Y - PLAYER_H - p.jumpH;

  // squish/stretch based on velocity
  const air     = Math.min(1, p.jumpH / 90);
  const scaleY  = p.grounded ? 0.85 : 1 + air * 0.2;
  const scaleX  = p.grounded ? 1.15 : 1 - air * 0.1;
  const drawW   = PLAYER_W * scaleX;
  const drawH   = PLAYER_H * scaleY;
  const drawX   = PLAYER_X + (PLAYER_W - drawW) / 2;
  const drawY   = py + (PLAYER_H - drawH); // anchor bottom

  drawRect(drawX, drawY, drawW, drawH, p.color, isMe, p);
}

function drawRect(drawX, drawY, drawW, drawH, color, isMe, p) {
  const r = 8;
  ctx.shadowColor = color;
  ctx.shadowBlur  = isMe ? 20 : 10;

  // body
  ctx.beginPath(); ctx.roundRect(drawX,drawY,drawW,drawH,r);
  ctx.fillStyle = color; ctx.fill();

  // highlight
  const hl = ctx.createLinearGradient(drawX,drawY,drawX,drawY+drawH);
  hl.addColorStop(0,'rgba(255,255,255,.25)');
  hl.addColorStop(1,'rgba(0,0,0,.2)');
  ctx.fillStyle = hl; ctx.fill();

  ctx.shadowBlur = 0;

  // border
  ctx.strokeStyle = isMe ? 'rgba(255,255,255,.9)' : 'rgba(0,0,0,.35)';
  ctx.lineWidth   = isMe ? 2.5 : 1.5;
  ctx.beginPath(); ctx.roundRect(drawX,drawY,drawW,drawH,r); ctx.stroke();

  // eyes
  const ey  = drawY + drawH * 0.3;
  const er  = Math.min(5.5, drawW * 0.13);
  const eox = drawW * 0.22;
  const poy = p && !p.grounded ? -1.5 : 1;

  [[drawX+drawW/2-eox,ey],[drawX+drawW/2+eox,ey]].forEach(([ex,eyy]) => {
    ctx.beginPath(); ctx.arc(ex,eyy,er,0,Math.PI*2);
    ctx.fillStyle='#fff'; ctx.fill();
    ctx.beginPath(); ctx.arc(ex,eyy+poy,er*.55,0,Math.PI*2);
    ctx.fillStyle='#111'; ctx.fill();
  });

  // name tag above
  if (p) {
    ctx.font      = `bold 11px 'Segoe UI',system-ui`;
    ctx.textAlign = 'center';
    ctx.fillStyle = p.alive ? 'rgba(255,255,255,.85)' : 'rgba(255,100,100,.5)';
    ctx.fillText(
      (p.name || '') + (p.id === myId ? ' ★' : '') + (!p.alive ? ' 💀' : ''),
      drawX + drawW/2, drawY - 7
    );
  }
}

function drawObstacles(obstacles) {
  if (!obstacles) return;
  obstacles.forEach(obs => {
    const x = obs.x, y = GROUND_Y - obs.h, w = obs.w, h = obs.h;
    const r = [4,4,0,0];

    ctx.shadowColor = '#FF4444';
    ctx.shadowBlur  = 12;

    ctx.beginPath(); ctx.roundRect(x,y,w,h,r);
    const og = ctx.createLinearGradient(x,y,x,y+h);
    og.addColorStop(0,'#FF6666');
    og.addColorStop(1,'#AA1111');
    ctx.fillStyle = og; ctx.fill();

    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,150,150,.35)';
    ctx.lineWidth   = 1;
    ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.stroke();

    // vertical line detail on tall obstacles
    if (h > 55) {
      ctx.strokeStyle = 'rgba(0,0,0,.2)';
      ctx.lineWidth   = 1;
      ctx.beginPath();
      ctx.moveTo(x+w/2, y); ctx.lineTo(x+w/2, y+h);
      ctx.stroke();
    }
  });
}

function drawHUD(s) {
  // top bar bg
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  ctx.fillRect(0,0,WORLD_W,54);
  ctx.strokeStyle = 'rgba(255,255,255,.06)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0,54); ctx.lineTo(WORLD_W,54); ctx.stroke();

  // room code (top left)
  ctx.font      = 'bold 11px monospace';
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,255,255,.25)';
  ctx.fillText('ROOM', 18, 22);
  ctx.font      = 'bold 15px monospace';
  ctx.fillStyle = 'rgba(255,212,50,.7)';
  ctx.fillText(s.code || '', 18, 40);

  // score (center)
  ctx.font      = 'bold 11px "Segoe UI"';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,.3)';
  ctx.fillText('SCORE', WORLD_W/2, 20);
  ctx.font      = 'bold 26px monospace';
  ctx.fillStyle = '#fff';
  ctx.fillText(String(s.score||0).padStart(6,'0'), WORLD_W/2, 43);

  // speed (right)
  const sp  = s.speed || 0;
  const pct = Math.min(1,(sp-5.5)/14.5);
  const hue = 120 - pct*120;
  const col = `hsl(${hue},80%,60%)`;

  ctx.font      = 'bold 11px "Segoe UI"';
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(255,255,255,.3)';
  ctx.fillText('SPEED', WORLD_W-18, 20);
  ctx.font      = 'bold 16px "Segoe UI"';
  ctx.fillStyle = col;
  ctx.fillText(`${sp.toFixed(1)}×`, WORLD_W-18, 38);

  // speed bar
  ctx.fillStyle = 'rgba(255,255,255,.07)';
  ctx.beginPath(); ctx.roundRect(WORLD_W-120,42,102,5,3); ctx.fill();
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.roundRect(WORLD_W-120,42,102*pct,5,3); ctx.fill();

  // alive player dots (bottom of hud bar)
  if (s.players) {
    const alive = s.players.filter(p=>p.alive).length;
    const total = s.players.length;
    ctx.font      = 'bold 11px "Segoe UI"';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,.3)';
    ctx.fillText(`${alive}/${total} alive`, WORLD_W/2, 57+12);

    // colored dots
    const dotY = 57+26;
    const dotSpacing = 18;
    const startX = WORLD_W/2 - (total-1)*dotSpacing/2;
    s.players.forEach((p,i) => {
      ctx.beginPath();
      ctx.arc(startX + i*dotSpacing, dotY, 5, 0, Math.PI*2);
      ctx.fillStyle = p.alive ? p.color : 'rgba(255,255,255,.15)';
      ctx.fill();
      if (p.id === myId) {
        ctx.strokeStyle = 'rgba(255,255,255,.7)';
        ctx.lineWidth   = 1.5;
        ctx.beginPath();
        ctx.arc(startX + i*dotSpacing, dotY, 7, 0, Math.PI*2);
        ctx.stroke();
      }
    });
  }
}

// ── Render loop ─────────────────────────────────────────────────────
function render() {
  requestAnimationFrame(render);
  ctx.clearRect(0,0,WORLD_W,WORLD_H);
  drawBg();

  if (!snap || (snap.phase !== 'playing' && snap.phase !== 'countdown' && snap.phase !== 'roundover')) {
    return;
  }

  drawGround();
  drawObstacles(snap.obstacles);
  drawPlayers(snap.players);
  drawHUD(snap);
}
render();

// ── Utils ───────────────────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}
</script>
</body>
</html>
